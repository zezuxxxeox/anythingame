<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>작은 정원</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#bfe3e8; touch-action:none;
    user-select:none; -webkit-user-select:none;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; top:12px; left:16px; right:16px; display:flex; justify-content:space-between;
    align-items:center; color:#fff; font-size:16px; font-weight:600; text-shadow:0 1px 3px rgba(0,0,0,.25); pointer-events:none; }
  #hud button { pointer-events:auto; background:rgba(255,255,255,.25); border:0; border-radius:999px;
    color:#fff; font-size:16px; padding:6px 12px; margin-left:6px; cursor:pointer; }
  #msg { position:fixed; left:0; right:0; bottom:28px; text-align:center; color:#fff; font-size:17px;
    text-shadow:0 1px 4px rgba(0,0,0,.35); pointer-events:none; transition:opacity 1.5s; padding:0 16px; }
  #intro { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:16px; background:rgba(40,60,70,.35); color:#fff; transition:opacity .8s; }
  #intro h1 { font-size:40px; margin:0 0 10px; font-weight:700; letter-spacing:2px; }
  #intro p { margin:5px 0; line-height:1.6; }
  #intro .start { margin-top:20px; font-size:18px; opacity:.85; animation:breathe 3s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity:.4; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span id="count">🌸 0</span>
  <span><button id="snd">🔔 소리</button><button id="clear" title="정원 비우기">🍂</button></span>
</div>
<div id="msg"></div>
<div id="intro">
  <h1>작은 정원</h1>
  <p>서두를 것도, 실패할 것도 없어요.</p>
  <p>🌱 빈 땅을 누르면 씨앗을 심어요<br>💧 식물을 누르면 물을 줘요<br>🌸 꽃이 피면 나비와 반딧불이가 찾아와요</p>
  <p class="start">아무 곳이나 눌러 시작하기</p>
</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $count = document.getElementById('count'), $msg = document.getElementById('msg'), $intro = document.getElementById('intro');
  let W, H, GY;
  function resize() {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0); GY = H * 0.62;
  }
  addEventListener('resize', resize); resize();

  // ---------- save ----------
  const store = {
    get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const PETALS = ['#ff9eb5', '#ffd166', '#c3a6ff', '#ffffff', '#ff8c69', '#8fd3ff', '#f7a8d8'];
  // plants stored with x as fraction of width so the garden survives resizing
  let plants = store.get('garden.plants', []);
  let bloomed = store.get('garden.bloomed', 0);
  let soundOn = store.get('garden.sound', true);
  $count.textContent = '🌸 ' + bloomed;
  const save = () => { store.set('garden.plants', plants); store.set('garden.bloomed', bloomed); };

  // ---------- gentle sound ----------
  let ac = null;
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16]; // pentatonic-ish, never sounds wrong
  function chime(step = Math.floor(Math.random() * SCALE.length), vol = .12, base = 523.25) {
    if (!soundOn) return;
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
    const t = ac.currentTime, f = base * Math.pow(2, SCALE[step % SCALE.length] / 12);
    [1, 2.01].forEach((m, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f * m;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol / (i + 1), t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + 2.2);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 2.3);
    });
  }
  const $snd = document.getElementById('snd');
  const sndLabel = () => $snd.textContent = soundOn ? '🔔 소리' : '🔕 소리';
  sndLabel();
  $snd.addEventListener('pointerdown', e => { e.stopPropagation(); soundOn = !soundOn; store.set('garden.sound', soundOn); sndLabel(); chime(4); });
  document.getElementById('clear').addEventListener('pointerdown', e => {
    e.stopPropagation();
    if (!plants.length) return;
    if (confirm('정원을 비우고 새로 시작할까요? (피운 꽃 기록은 남아요)')) {
      plants.forEach(p => leaves(p.x * W, GY + p.y, 6)); plants = []; save(); say('땅이 다시 쉬어 가요');
    }
  });

  // ---------- messages ----------
  let msgT = 0;
  function say(t) { $msg.textContent = t; $msg.style.opacity = 1; msgT = 3.5; }
  const WHISPERS = ['천천히 해도 괜찮아요', '바람이 부드러워요', '오늘도 잘 지냈어요', '숨을 한 번 깊게 쉬어 봐요',
    '작은 것들이 자라고 있어요', '지금 이 순간도 충분해요', '꽃이 당신을 닮았네요'];

  // ---------- world ----------
  const DAY_LEN = 150; // seconds per full day/night cycle
  let tod = 0.3; // 0..1, 0.5 = midnight-ish handled by curve below
  const clouds = Array.from({ length: 5 }, () => ({ x: Math.random(), y: .05 + Math.random() * .25, s: .6 + Math.random() * .8, v: .004 + Math.random() * .006 }));
  const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * .6, t: Math.random() * 6 }));
  const grass = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), h: 6 + Math.random() * 10 }));
  let critters = [], fx = [], rain = 0, rainNext = 40 + Math.random() * 60, drops = [], clock = 0;

  // brightness: 1 = full day, 0 = night
  const light = () => { const v = Math.cos((tod - 0.25) * Math.PI * 2); return Math.max(0, Math.min(1, .5 + v * .8)); };
  const mix = (a, b, t) => { const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)); const A = p(a), B = p(b);
    return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };

  function leaves(x, y, n, colors = ['#7cc47f', '#a8d5a2', '#cde8b5']) {
    for (let i = 0; i < n; i++) fx.push({ x, y, vx: (Math.random() - .5) * 60, vy: -20 - Math.random() * 50, life: 1.4, max: 1.4,
      c: colors[i % colors.length], r: 2 + Math.random() * 2, g: 40 });
  }

  function water(p, quiet) {
    p.w = (p.w || 0) + 1;
    const need = [2, 3, 3, 4][p.stage] || 0;
    if (p.stage < 4 && p.w >= need) {
      p.stage++; p.w = 0; p.grow = 1;
      if (p.stage === 4) {
        bloomed++; $count.textContent = '🌸 ' + bloomed;
        leaves(p.x * W, GY + p.y - p.h, 14, [p.color, '#fff', p.color]);
        if (!quiet) { chime(5, .14); setTimeout(() => chime(7, .1), 180); say(bloomed === 1 ? '첫 꽃이 피었어요 🌸' : WHISPERS[Math.floor(Math.random() * WHISPERS.length)]); }
      }
      save();
    }
  }

  function tap(x, y) {
    if ($intro) { $intro.style.opacity = 0; setTimeout(() => $intro.remove(), 800); window.$introGone = true; }
    if (!window.$introGone) return;
    // find a plant near the tap
    let hit = null, bd = 50;
    for (const p of plants) {
      const px = p.x * W, py = GY + p.y, top = py - Math.max(20, p.h);
      if (x > px - 28 && x < px + 28 && y > top - 24 && y < py + 14) {
        const d = Math.abs(x - px); if (d < bd) { bd = d; hit = p; }
      }
    }
    if (hit) {
      for (let i = 0; i < 6; i++) fx.push({ x: x + (Math.random() - .5) * 20, y: y - 30, vx: 0, vy: 80 + Math.random() * 40, life: .5, max: .5, c: '#8fd3ff', r: 2.5, g: 300 });
      chime(Math.min(7, hit.stage + 1 + Math.floor(Math.random() * 3)), .09);
      if (hit.stage === 4) { // touching a flower releases a friend
        hit.sway = 1; spawnCritter(hit.x * W, GY + hit.y - hit.h);
      } else water(hit);
      save();
    } else if (y > GY - 4 && y < H - 10) {
      if (plants.length >= 60) { say('정원이 가득 찼어요 — 꽃을 만져 보세요'); return; }
      plants.push({ x: x / W, y: y - GY, stage: 0, w: 0, h: 0, color: PETALS[Math.floor(Math.random() * PETALS.length)],
        kind: Math.floor(Math.random() * 3), seed: Math.random() * 10, grow: 0 });
      plants.sort((a, b) => a.y - b.y);
      leaves(x, y, 5, ['#9b7653', '#b98f68']);
      chime(0, .08);
      save();
    } else {
      chime(undefined, .05); // tapping the sky just makes a soft sound
      for (let i = 0; i < 5; i++) fx.push({ x, y, vx: (Math.random() - .5) * 40, vy: (Math.random() - .5) * 40, life: 1, max: 1, c: '#fff', r: 1.5, g: 0 });
    }
  }
  addEventListener('pointerdown', e => { e.preventDefault(); tap(e.clientX, e.clientY); });
  addEventListener('keydown', e => { if (e.code === 'Space') tap(W / 2, GY + 40); });

  function spawnCritter(x, y) {
    if (critters.length > 25) return;
    const night = light() < .35;
    critters.push({ x, y, vx: (Math.random() - .5) * 30, vy: -10 - Math.random() * 20, t: Math.random() * 10,
      type: night ? 'fly' : 'bfly', c: PETALS[Math.floor(Math.random() * PETALS.length)], life: 25 + Math.random() * 20 });
  }

  // ---------- update ----------
  function update(dt) {
    clock += dt;
    tod = (tod + dt / DAY_LEN) % 1;
    for (const c of clouds) { c.x += c.v * dt; if (c.x > 1.3) c.x = -.3; }
    msgT -= dt; if (msgT < 0) $msg.style.opacity = 0;

    // occasional soft rain that waters everything
    rainNext -= dt;
    if (rainNext < 0 && rain <= 0) { rain = 12 + Math.random() * 8; rainNext = 70 + Math.random() * 80; if (plants.length) say('보슬비가 내려요 ☔'); }
    if (rain > 0) {
      rain -= dt;
      for (let i = 0; i < 3; i++) drops.push({ x: Math.random() * W, y: -10, v: 380 + Math.random() * 120 });
      if (Math.random() < dt * .6 && plants.length) { const p = plants[Math.floor(Math.random() * plants.length)]; if (p.stage < 4) water(p, false); }
    }
    for (const d of drops) d.y += d.v * dt;
    drops = drops.filter(d => d.y < GY + 40);

    for (const p of plants) {
      const target = [6, 18, 32, 46, 58][p.stage] * (p.kind === 1 ? 1.2 : p.kind === 2 ? .85 : 1);
      p.h += (target - p.h) * Math.min(1, dt * 3);
      p.grow = Math.max(0, (p.grow || 0) - dt * 2);
      p.sway = Math.max(0, (p.sway || 0) - dt);
    }
    // flowers attract visitors on their own
    const flowers = plants.filter(p => p.stage === 4);
    if (flowers.length && Math.random() < dt * Math.min(.5, flowers.length * .05)) {
      const f = flowers[Math.floor(Math.random() * flowers.length)]; spawnCritter(f.x * W, GY + f.y - f.h);
    }
    for (const c of critters) {
      c.t += dt; c.life -= dt;
      c.vx += (Math.random() - .5) * 60 * dt; c.vy += (Math.random() - .5) * 60 * dt - 2 * dt;
      c.vx *= .99; c.vy *= .99;
      c.x += c.vx * dt + Math.sin(c.t * 2) * .3; c.y += c.vy * dt;
      if (c.y > GY + 30) c.vy -= 30 * dt;
    }
    critters = critters.filter(c => c.life > 0 && c.x > -50 && c.x < W + 50 && c.y > -50);
    for (const f of fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += f.g * dt; f.life -= dt; }
    fx = fx.filter(f => f.life > 0);
  }

  // ---------- draw ----------
  function drawPlant(p, L) {
    const x = p.x * W, y = GY + p.y, h = p.h;
    const sway = Math.sin(clock * 1.3 + p.seed) * (2 + h * .05) + Math.sin(clock * 9) * p.sway * 6;
    const scale = .8 + (p.y / (H - GY)) * .4; // nearer plants are a little bigger
    const tx = x + sway, ty = y - h * scale;
    const stem = mix('#2f6b3a', '#5ea85f', L);
    if (p.stage === 0) { // seed mound
      ctx.fillStyle = mix('#3d2b1f', '#8a6545', L);
      ctx.beginPath(); ctx.ellipse(x, y, 9 * scale, 4 * scale, 0, 0, Math.PI * 2); ctx.fill();
      if (h > 3) { ctx.strokeStyle = stem; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y - 2); ctx.lineTo(x + sway * .3, y - h * scale); ctx.stroke(); }
      return;
    }
    ctx.strokeStyle = stem; ctx.lineWidth = 2.5 * scale; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + sway * .2, y - h * scale * .5, tx, ty); ctx.stroke();
    // leaves
    ctx.fillStyle = mix('#3a7d45', '#7cc47f', L);
    const nl = Math.min(p.stage, 3);
    for (let i = 0; i < nl; i++) {
      const k = .3 + i * .22, lx = x + sway * k * .4, ly = y - h * scale * k, side = i % 2 ? 1 : -1;
      ctx.beginPath(); ctx.ellipse(lx + side * 7 * scale, ly, 8 * scale, 3.5 * scale, side * -.5, 0, Math.PI * 2); ctx.fill();
    }
    const pop = 1 + (p.grow || 0) * .3;
    if (p.stage === 3) { // bud
      ctx.fillStyle = p.color; ctx.globalAlpha = .85;
      ctx.beginPath(); ctx.ellipse(tx, ty - 3, 4 * scale * pop, 6 * scale * pop, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    } else if (p.stage === 4) {
      const r = 9 * scale * pop, n = p.kind === 2 ? 8 : p.kind === 1 ? 6 : 5, rot = p.seed + clock * .1;
      if (L < .4) { ctx.shadowColor = p.color; ctx.shadowBlur = 12 * (1 - L); }
      ctx.fillStyle = p.color;
      for (let i = 0; i < n; i++) {
        const a = rot + i * Math.PI * 2 / n;
        ctx.beginPath(); ctx.ellipse(tx + Math.cos(a) * r * .6, ty + Math.sin(a) * r * .6, r * .55, r * .32, a, 0, Math.PI * 2); ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffe08a'; ctx.beginPath(); ctx.arc(tx, ty, r * .3, 0, Math.PI * 2); ctx.fill();
    }
  }

  function draw() {
    const L = light();
    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, GY);
    sky.addColorStop(0, mix('#141a3a', '#8ecae6', L)); sky.addColorStop(1, mix('#3b3a6b', '#fde2c4', L));
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, GY + 2);
    // stars
    if (L < .6) for (const s of stars) {
      ctx.globalAlpha = (1 - L / .6) * (.4 + .5 * Math.sin(clock * 1.5 + s.t));
      ctx.fillStyle = '#fff'; ctx.fillRect(s.x * W, s.y * GY, 1.5, 1.5);
    }
    ctx.globalAlpha = 1;
    // sun & moon travel across the sky
    const ang = tod * Math.PI * 2;
    const sx = W / 2 - Math.sin(ang - Math.PI / 2) * W * .42, sy = GY - Math.cos(ang - Math.PI / 2) * GY * .8;
    const mx = W / 2 + Math.sin(ang - Math.PI / 2) * W * .42, my = GY + Math.cos(ang - Math.PI / 2) * GY * .8;
    ctx.fillStyle = '#fff3c4'; ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(sx, sy, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f4f1ff'; ctx.shadowColor = '#c3c8ff'; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(mx, my, 18, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // clouds
    ctx.fillStyle = mix('#5a5f8a', '#ffffff', L); ctx.globalAlpha = rain > 0 ? .95 : .8;
    for (const c of clouds) {
      const x = c.x * W, y = c.y * GY, s = c.s * 30;
      ctx.beginPath(); ctx.arc(x, y, s, 0, 7); ctx.arc(x + s, y + 4, s * .8, 0, 7); ctx.arc(x - s, y + 6, s * .7, 0, 7); ctx.arc(x + s * .3, y - s * .5, s * .7, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // distant hills
    ctx.fillStyle = mix('#23304a', '#9ccc9a', L);
    ctx.beginPath(); ctx.moveTo(0, GY);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, GY - 30 - Math.sin(x * .006 + 1) * 25 - Math.sin(x * .017) * 8);
    ctx.lineTo(W, GY); ctx.fill();
    // ground
    const gr = ctx.createLinearGradient(0, GY, 0, H);
    gr.addColorStop(0, mix('#1f3b2c', '#8fcf7f', L)); gr.addColorStop(1, mix('#162a20', '#5fa45a', L));
    ctx.fillStyle = gr; ctx.fillRect(0, GY, W, H - GY);
    ctx.strokeStyle = mix('#2c5038', '#a9dd95', L); ctx.lineWidth = 1.5;
    for (const g of grass) {
      const x = g.x * W, y = GY + 6 + g.y * (H - GY - 6), sw = Math.sin(clock + g.x * 20) * 3;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x, y - g.h / 2, x + sw, y - g.h); ctx.stroke();
    }
    // rain
    if (drops.length) { ctx.strokeStyle = 'rgba(200,225,255,.6)'; ctx.lineWidth = 1; ctx.beginPath();
      for (const d of drops) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 2, d.y + 10); } ctx.stroke(); }

    for (const p of plants) drawPlant(p, L);

    // visitors
    for (const c of critters) {
      const fade = Math.min(1, c.life / 3, c.t);
      if (c.type === 'fly') {
        ctx.globalAlpha = fade * (.5 + .5 * Math.sin(c.t * 4));
        ctx.fillStyle = '#fff6a8'; ctx.shadowColor = '#fff176'; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(c.x, c.y, 2.5, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
      } else {
        ctx.globalAlpha = fade; ctx.fillStyle = c.c;
        const f = Math.abs(Math.sin(c.t * 10)) * 6 + 1;
        ctx.beginPath(); ctx.ellipse(c.x - f / 2 - 1, c.y, f / 2 + .5, 5, 0, 0, 7); ctx.ellipse(c.x + f / 2 + 1, c.y, f / 2 + .5, 5, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#3b3b3b'; ctx.fillRect(c.x - .7, c.y - 4, 1.4, 8);
      }
    }
    ctx.globalAlpha = 1;
    for (const f of fx) { ctx.globalAlpha = Math.max(0, f.life / f.max); ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    // night tint over everything
    if (L < 1) { ctx.fillStyle = `rgba(20,25,60,${(1 - L) * .25})`; ctx.fillRect(0, 0, W, H); }
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt); draw(); requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
